    function compareBar(){document.querySelector('#compare-bar')?.remove();if(!state.compare.size)return;const bar=document.createElement('div');bar.id='compare-bar';bar.className='compare-bar';bar.innerHTML=`<span>${state.compare.size} ứng dụng đã chọn</span><button class="ghost-btn" id="compare-open">So sánh</button><button class="icon-btn" id="clear-compare">×</button>`;document.body.append(bar);bar.querySelector('#clear-compare').onclick=()=>{state.compare.clear();render();compareBar()}}
    document.querySelector('#search').addEventListener('input',e=>{state.query=e.target.value.trim();if(state.query)state.view='all';render()});document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';state.query='';render()}});document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('#search').focus()}if(e.key==='Escape')document.querySelector('#overlay').innerHTML=''});
    document.addEventListener('submit',e=>{if(e.target.id==='category-edit-form'){e.preventDefault();const f=new FormData(e.target),oldName=f.get('oldName'),name=f.get('name').trim();if(name!==oldName&&categories().some(c=>c.toLowerCase()===name.toLowerCase())){toast('Tên danh mục đã tồn tại');return}if(name!==oldName){state.apps.forEach(a=>{if(a.category===oldName)a.category=name});state.categories=state.categories.filter(c=>c!==oldName);if(defaultCategories.includes(oldName)&&!state.hiddenCategories.includes(oldName))state.hiddenCategories.push(oldName);state.hiddenCategories=state.hiddenCategories.filter(c=>c!==name);if(!defaultCategories.includes(name)&&!state.categories.includes(name))state.categories.push(name);if(state.category===oldName)state.category=name}delete state.categoryInfo[oldName];state.categoryInfo[name]={icon:f.get('icon').trim(),description:f.get('description').trim()};save();document.querySelector('#overlay').innerHTML='';render();toast('Đã cập nhật danh mục');return}if(e.target.id==='category-form'){e.preventDefault();const f=new FormData(e.target),name=f.get('category').trim();if(categories().some(c=>c.toLowerCase()===name.toLowerCase())){toast('Danh mục này đã có');return}state.hiddenCategories=state.hiddenCategories.filter(c=>c!==name);if(!defaultCategories.includes(name))state.categories.push(name);state.categoryInfo[name]={icon:f.get('icon').trim(),description:f.get('description').trim()};save();render();toast('Đã thêm danh mục');return}if(e.target.id==='content-form'){e.preventDefault();const f=new FormData(e.target);for(const k of Object.keys(state.settings))if(f.has(k))state.settings[k]=String(f.get(k)).trim();const socialKeys=['telegram','zalo','tiktok','youtube','facebook','github'],nextSocial={};for(const key of socialKeys){const url=String(f.get('social_'+key)||'').trim();if(url&&!/^https?:\/\//i.test(url)){toast('Liên kết '+key+' phải bắt đầu bằng https://');return}nextSocial[key]=url}state.socialLinks=nextSocial;save();render();toast('Đã lưu nội dung và liên kết');return}if(e.target.id!=='app-form')return;e.preventDefault();const f=new FormData(e.target),id=f.get('id'),old=appById(id);const url=f.get('url')||'';if(url&&!/^https?:\/\//i.test(url)){toast('Địa chỉ ứng dụng phải bắt đầu bằng https://');return}const item={...(old||{}),id,name:f.get('name').trim(),maker:f.get('maker').trim()||'Nhà phát triển độc lập',category:f.get('category').trim()||'Tiện ích',icon:f.get('icon').trim()||'✦',color:old?.color||'#35486c',rating:Math.min(5,Math.max(0,Number(f.get('rating'))||0)),price:f.get('price').trim()||'Miễn phí',version:f.get('version').trim(),platform:old?.platform||'Web',url,description:f.get('description').trim(),details:f.get('details').trim(),tags:f.get('tags').split(',').map(s=>s.trim()).filter(Boolean),featured:f.has('featured'),trending:f.has('trending')};const i=state.apps.findIndex(a=>a.id===id);if(i>=0)state.apps[i]=item;else state.apps.unshift(item);save();document.querySelector('#overlay').innerHTML='';render();toast(i>=0?'Đã cập nhật ứng dụng':'Đã thêm ứng dụng')});
    document.querySelector('#restore-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='phudong-library'||!Array.isArray(data.apps)||!data.apps.every(a=>a&&typeof a.id==='string'&&typeof a.name==='string'))throw Error('invalid');if(!confirm(`Khôi phục ${data.apps.length} ứng dụng từ bản sao lưu? Dữ liệu thư viện hiện tại sẽ được thay thế.`)){e.target.value='';return}state.apps=data.apps;state.favorites=new Set(Array.isArray(data.favorites)?data.favorites.filter(id=>state.apps.some(a=>a.id===id)):[]);state.categories=Array.isArray(data.categories)?data.categories:[];state.hiddenCategories=Array.isArray(data.hiddenCategories)?data.hiddenCategories:[];state.categoryInfo=data.categoryInfo&&typeof data.categoryInfo==='object'?data.categoryInfo:{};state.socialLinks=data.socialLinks&&typeof data.socialLinks==='object'?data.socialLinks:{telegram:'',zalo:'',tiktok:'',youtube:'',facebook:'',github:''};if(data.settings&&typeof data.settings==='object')state.settings={...state.settings,...data.settings};state.compare.clear();state.category='';state.view='all';save();render();compareBar();toast('Đã khôi phục dữ liệu thư viện')}catch{toast('Tệp sao lưu không hợp lệ')}finally{e.target.value=''}});
    document.body.classList.toggle('light',state.theme==='light');render();initializeLocalStorage();checkAdminSession();
  </script>
